name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web app — typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Database — migrations + RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and tests
        working-directory: supabase
        run: |
          psql -v ON_ERROR_STOP=1 -q -f tests/supabase_stub.sql $(ls migrations/*.sql | sed 's/^/-f /') -f tests/rls_test.sql -f tests/admin_test.sql | tee out.txt
          grep -q ALL_TESTS_PASSED out.txt && grep -q ADMIN_TESTS_PASSED out.txt

  functions:
    name: Edge functions — deno check + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - working-directory: supabase/functions
        run: |
          deno check line-liff/index.ts line-push/index.ts line-webhook/index.ts
          deno test _shared/
